<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALIBRO</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #000;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
font-family: ‘Cinzel’, serif;
}

.scene {
position: relative;
width: 900px;
height: 600px;
display: flex;
align-items: center;
justify-content: center;
}

/* Background — dark marble texture via CSS */
.bg {
position: absolute;
inset: 0;
background:
radial-gradient(ellipse at 50% 50%, #1a0a00 0%, #000 70%),
repeating-linear-gradient(
47deg,
transparent,
transparent 2px,
rgba(255,200,50,0.015) 2px,
rgba(255,200,50,0.015) 4px
);
}

/* Vignette */
.vignette {
position: absolute;
inset: 0;
background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
pointer-events: none;
}

/* Decorative corner filigrees */
.corner {
position: absolute;
width: 80px;
height: 80px;
border-color: rgba(180,130,30,0.6);
border-style: solid;
}
.corner-tl { top: 24px; left: 24px; border-width: 2px 0 0 2px; }
.corner-tr { top: 24px; right: 24px; border-width: 2px 2px 0 0; }
.corner-bl { bottom: 24px; left: 24px; border-width: 0 0 2px 2px; }
.corner-br { bottom: 24px; right: 24px; border-width: 0 2px 2px 0; }

.corner::after {
content: ‘✦’;
position: absolute;
color: rgba(200,150,40,0.5);
font-size: 10px;
}
.corner-tl::after { top: -6px; left: -6px; }
.corner-tr::after { top: -6px; right: -6px; }
.corner-bl::after { bottom: -6px; left: -6px; }
.corner-br::after { bottom: -6px; right: -6px; }

.content {
position: relative;
text-align: center;
z-index: 10;
}

/* Katakana above */
.katakana {
font-family: ‘Cormorant Garamond’, serif;
font-size: 13px;
letter-spacing: 0.8em;
color: rgba(200,150,40,0.7);
text-transform: uppercase;
margin-bottom: 12px;
display: block;
}

/* Thin gold line */
.line {
width: 320px;
height: 1px;
margin: 0 auto 16px;
background: linear-gradient(90deg, transparent, rgba(200,150,40,0.8), rgba(255,220,80,1), rgba(200,150,40,0.8), transparent);
position: relative;
}
.line::before, .line::after {
content: ‘◆’;
position: absolute;
top: 50%;
transform: translateY(-50%);
color: rgba(200,150,40,0.9);
font-size: 7px;
}
.line::before { left: 60px; }
.line::after { right: 60px; }

/* Main title */
.title {
font-family: ‘Cinzel Decorative’, serif;
font-weight: 900;
font-size: 110px;
letter-spacing: 0.18em;
line-height: 1;
position: relative;
display: flex;
align-items: center;
justify-content: center;
white-space: nowrap;
animation: shimmer 4s ease-in-out infinite;
}

.title-letter {
display: inline-block;
background: linear-gradient(
180deg,
#fff8dc 0%,
#ffd700 15%,
#b8860b 35%,
#ffd700 50%,
#daa520 65%,
#ffd700 80%,
#fff8dc 100%
);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
filter: drop-shadow(0 0 20px rgba(255,200,0,0.4)) drop-shadow(0 4px 8px rgba(0,0,0,0.8));
}

@keyframes shimmer {
0%, 100% { filter: drop-shadow(0 0 20px rgba(255,200,0,0.4)) drop-shadow(0 4px 8px rgba(0,0,0,0.8)); }
50% { filter: drop-shadow(0 0 35px rgba(255,220,0,0.6)) drop-shadow(0 4px 8px rgba(0,0,0,0.8)); }
}

.letter-b {
position: relative;
}

.blood {
position: absolute;
top: -8px;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
z-index: 20;
}

.blood-drop {
position: absolute;
background: linear-gradient(180deg, #8b0000, #cc0000);
border-radius: 50% 50% 60% 60%;
filter: drop-shadow(0 0 3px rgba(139,0,0,0.8));
}

.drop-1 { width: 4px; height: 12px; top: 2px; left: 28%; border-radius: 2px 2px 50% 50%; }
.drop-2 { width: 3px; height: 8px; top: 5px; left: 42%; border-radius: 2px 2px 50% 50%; }
.drop-3 { width: 5px; height: 16px; top: 0px; left: 58%; border-radius: 2px 2px 50% 50%; }
.drop-4 { width: 3px; height: 6px; top: 8px; left: 72%; border-radius: 2px 2px 50% 50%; }

/* The R — something is happening to the R */
.letter-r {
position: relative;
}
.letter-r::after {
content: ‘⚜’;
position: absolute;
bottom: -14px;
left: 50%;
transform: translateX(-50%);
font-size: 11px;
background: linear-gradient(180deg, #ffd700, #b8860b);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
opacity: 0.8;
}

/* Bottom line */
.line-bottom {
width: 320px;
height: 1px;
margin: 20px auto 14px;
background: linear-gradient(90deg, transparent, rgba(200,150,40,0.8), rgba(255,220,80,1), rgba(200,150,40,0.8), transparent);
position: relative;
}
.line-bottom::before, .line-bottom::after {
content: ‘◆’;
position: absolute;
top: 50%;
transform: translateY(-50%);
color: rgba(200,150,40,0.9);
font-size: 7px;
}
.line-bottom::before { left: 60px; }
.line-bottom::after { right: 60px; }

/* Tagline */
.tagline {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 14px;
letter-spacing: 0.35em;
color: rgba(200,160,60,0.75);
text-transform: uppercase;
margin-bottom: 18px;
}

/* チェーザレ */
.cesare-jp {
font-family: ‘Cormorant Garamond’, serif;
font-size: 11px;
letter-spacing: 0.6em;
color: rgba(180,130,30,0.5);
text-transform: uppercase;
}

/* Particle glow dots */
.particles {
position: absolute;
inset: 0;
pointer-events: none;
overflow: hidden;
}

.particle {
position: absolute;
border-radius: 50%;
background: rgba(255,200,50,0.6);
animation: float linear infinite;
}

@keyframes float {
0% { transform: translateY(0) translateX(0); opacity: 0; }
10% { opacity: 1; }
90% { opacity: 0.5; }
100% { transform: translateY(-400px) translateX(var(–dx)); opacity: 0; }
}

/* Ambient red glow at bottom — suggests something dark */
.red-glow {
position: absolute;
bottom: 0;
left: 50%;
transform: translateX(-50%);
width: 400px;
height: 120px;
background: radial-gradient(ellipse at center bottom, rgba(100,0,0,0.25) 0%, transparent 70%);
pointer-events: none;
}

/* Subtitle — unnecessarily complicated */
.subtitle-block {
position: absolute;
bottom: 50px;
right: 60px;
text-align: right;
}

.subtitle-jp {
font-family: ‘Cormorant Garamond’, serif;
font-size: 10px;
letter-spacing: 0.4em;
color: rgba(180,130,30,0.4);
display: block;
margin-bottom: 4px;
}

.subtitle-rating {
font-family: ‘Cinzel’, serif;
font-size: 9px;
letter-spacing: 0.3em;
color: rgba(180,130,30,0.35);
border: 1px solid rgba(180,130,30,0.25);
padding: 2px 8px;
display: inline-block;
}

/* Top left — studio name doing too much */
.studio {
position: absolute;
top: 50px;
left: 60px;
text-align: left;
}

.studio-name {
font-family: ‘Cinzel’, serif;
font-size: 9px;
letter-spacing: 0.5em;
color: rgba(180,130,30,0.4);
display: block;
}

.studio-line {
width: 60px;
height: 1px;
background: rgba(180,130,30,0.3);
margin-top: 4px;
}

</style>
</head>
